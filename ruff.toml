line-length = 110
target-version = "py311"
include = ["agents/**/*.py", "hooks/**/*.py", "scripts/**/*.py", "data/eval/**/*.py", "src/ohmyboring/**/*.py", "integrations/**/*.py"]

[lint]
select = ["E", "F", "I", "B", "UP", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702"]
# PLR1702 is preview-only: preview on, but explicit-preview-rules keeps the *stable* rules
# (E·F·I·B·UP) in stable behaviour so the old trees cannot sprout new diagnostics.
preview = true
explicit-preview-rules = true
# E501: format handles code; long strings and Korean prose lines stay.
# E402: hooks and scripts put agents/shared on sys.path before importing it.
# B905: zip(strict=) is a behaviour decision per call site, not hygiene.
# E101: after `ruff format` the only hits are tabs inside string literals (a launchd plist
#       template, a verbose regex) — data, not indentation.
ignore = ["E501", "E402", "B905", "E101"]

# Complexity/size rules are the NEW packages' hygiene gate only. The old trees keep their
# historical E·F·I·B·UP surface — switching the new rules on there would surface ~121
# violations that are not this migration's to fix.
[lint.per-file-ignores]
"agents/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702"]
"hooks/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702"]
"scripts/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702"]
"data/eval/**" = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR1702"]

[lint.pylint]
max-nested-blocks = 4

[format]
quote-style = "double"
