# ohmyboring pre-commit — 커밋 전 게이트. 린트(fmt·clippy·ruff)와 바뀐 시험 파일만. CI 는 시험을 안 돌린다.
# 설치: pre-commit install   (요건: pre-commit, cargo+clippy+rustfmt)
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  # 시크릿 스캔 — staged 에서 토큰/키 차단 (CI gitleaks 가 전체 히스토리 재검).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python 위생 = 린터 + 포맷터까지 (ruff.toml 이 규칙). 그 밖의 규율은 도구가 아니라 스킬로.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: no-meaningless-filenames
        name: "의미 없는 파일명 금지 (mod/util/misc/helper/common)"
        entry: "의미 없는 파일명 — 모듈 의도를 드러내는 이름을 쓰세요. mod.rs 는 edition 2024 폐기, util/misc 등은 junk-drawer. (.rs·.py)"
        language: fail
        files: (^|/)(mod|utils?|misc|helpers?|common)\.(rs|py)$

      - id: cargo-fmt
        name: cargo fmt --check (drudge)
        entry: cargo fmt --manifest-path drudge/Cargo.toml --check
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-clippy
        name: "cargo clippy -D warnings (drudge, 철학 게이트)"
        entry: cargo clippy --manifest-path drudge/Cargo.toml --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: \.(rs|toml)$

      # 시험은 바뀐 시험 파일만 돈다. 전체 묶음은 어디서도 돌리지 않는다 (오너 10-19).
      - id: changed-tests
        name: "바뀐 시험 파일만 (test_*.py · scripts/test_*.sh)"
        # 커밋 중 git 이 넘기는 GIT_INDEX_FILE 이 시험 안의 임시 저장소 git 을 본 저장소로 끌고 간다.
        entry: env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE sh -c 'for f; do case "$f" in *.py) python3 "$f" ;; *.sh) sh "$f" ;; esac || exit 1; done' --
        language: system
        files: (^|/)test_[^/]*\.(py|sh)$

      - id: py-compile
        name: "python compile (agent adapters + scripts + eval — syntax gate)"
        entry: python3 -m py_compile
        language: system
        files: ^(agents|hooks|scripts|data/eval)/.*\.py$
