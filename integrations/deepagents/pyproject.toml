[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmyboring-deepagents"
version = "0.1.0"
description = "ohmyboring ↔ Deep Agents integration — memory backend and tools (moved in by a later slice)."
requires-python = ">=3.11"
# Framework dependency (deepagents) lands with the slice that moves the code in.
dependencies = ["ohmyboring"]

[tool.setuptools.packages.find]
where = ["src"]
