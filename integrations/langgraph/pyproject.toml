[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmyboring-langgraph"
version = "0.1.0"
description = "ohmyboring ↔ LangGraph integration — BoringStore and friends (moved in by a later slice)."
requires-python = ">=3.11"
# Framework dependency (langgraph) lands with the slice that moves the code in.
dependencies = ["ohmyboring"]

[tool.setuptools.packages.find]
where = ["src"]
