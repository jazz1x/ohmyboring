name: ci

# PR + main push 게이트. 로컬 scripts/guard.sh 와 동일 게이트를 그대로 호출(SSOT) +
# gitleaks 시크릿 스캔. 둘 다 통과해야 main 머지(브랜치 보호의 required check).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 바뀐 파일 종류로 무거운 세 잡(rust-gate·eval-gate·docker-build)을 건너뛴다 (C-CIWASTE1 나).
  # 각 패턴은 그 잡이 실제로 읽는 파일이다 (rust-gate = scripts/guard.sh 와 drudge `quality_gate` 시험이 읽는 것).
  # fail-open: 이 잡이 실패하거나, 비교 기준이 없거나, 바뀐 파일이 0 이면 세 잡 모두 돈다.
  # 잡 쪽 if: 는 출력이 정확히 'false' 일 때만 건너뛴다 — 출력이 비어도 돈다.
  # gitleaks·cargo-deny·trivy·compose-config 는 40초 이하라 항상 돈다 (cargo-deny 는 파일이 안 바뀌어도 새 RUSTSEC 권고로 걸린다).
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      eval: ${{ steps.diff.outputs.eval }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          emit() { printf 'rust=%s\neval=%s\ndocker=%s\n' "$1" "$2" "$3" | tee -a "$GITHUB_OUTPUT"; }
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo "no diff base -> everything runs"; emit true true true; exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          n=$(grep -c . "$RUNNER_TEMP/changed.txt" || true)
          echo "changed files: $n"; cat "$RUNNER_TEMP/changed.txt"
          if [ "$n" = 0 ]; then
            echo "0 changed files -> everything runs"; emit true true true; exit 0
          fi
          # rust-gate: guard.sh 가 부르는 모든 것 + 문서 시험이 읽는 문서.
          #   README*·CHANGELOG.md·docs/RUNBOOK.md (guard.sh test_readme_locale_parity·test_changelog·test_runbook)
          #   docs/PRD.md·GOALS.md·agents/codex/README.md (drudge/src/serve/mcp.rs quality_gate: 4869·4870·4933·4949)
          #   vault/.rules/ (drudge/src/vault/audit.rs:852)
          RUST='^(drudge/|scripts/|agents/|src/|hooks/|data/eval/|vault/\.rules/|\.github/workflows/ci\.yml$|docs/(RUNBOOK|PRD)\.md$|GOALS\.md$|CHANGELOG\.md$|README[^/]*$|Makefile$|install\.sh$|ruff\.toml$|pyproject\.toml$|uv\.lock$|requirements[^/]*\.txt$)|\.(py|sh)$'
          # eval-gate: ci.yml eval-gate 잡이 쓰는 코드·데이터·스택 정의.
          EVAL='^(drudge/|src/|agents/|data/(eval|schema|contract)/|scripts/(eval-gate\.sh|test_schema_parity\.sh|contract-parity\.py)$|vault/\.rules/|docker-compose[^/]*\.yml$|boring\.[^/]*json$|\.github/workflows/ci\.yml$|pyproject\.toml$|uv\.lock$|requirements[^/]*\.txt$)'
          # docker-build: make build (Makefile:41) = boring-drudge·boring-door 이미지 + 호스트 cargo build --release.
          DOCKER='^(drudge/|src/|agents/|data/contract/|Makefile$|docker-compose[^/]*\.yml$|\.dockerignore$|\.github/workflows/ci\.yml$|pyproject\.toml$|uv\.lock$|requirements[^/]*\.txt$)|(^|/)Dockerfile$'
          flag() { if grep -Eq "$1" "$RUNNER_TEMP/changed.txt"; then echo true; else echo false; fi; }
          emit "$(flag "$RUST")" "$(flag "$EVAL")" "$(flag "$DOCKER")"

  rust-gate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/test_changelog.py scopes the branch against origin/main; a shallow clone has no such ref
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: drudge
          shared-key: drudge # same key across every job that builds drudge, so the cache isn't split per job name
      # guard.sh runs the Python suites too, and two of them need PyYAML. Until 2026-09-19 nothing
      # installed it and the job was green because the runner image ships it — an accident, not a
      # gate. scripts/test_python_deps.py fails if this list and the imports drift apart.
      - uses: astral-sh/setup-uv@v7
      # uv.lock pins only pyproject.toml's dependencies; requirements*.txt (what the door, the
      # secretary and the gates import beyond them) go in on top of the same .venv, and ruff
      # (guard.sh step 4b calls it by name) comes from there.
      - name: install the declared Python dependency
        run: |
          uv sync --locked
          uv pip install --quiet -r requirements.txt -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # scripts/guard.sh = rustfmt --check + clippy -D warnings + test (스택-프리).
      - name: structural gate (guard.sh)
        run: ./scripts/guard.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리 스캔(과거 커밋 누수도 잡음)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # supply-chain gate — dependency vulns (RUSTSEC), licenses, duplicate versions. drudge/deny.toml is the policy.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: drudge/Cargo.toml
          arguments: --all-features

  # broad security scan — filesystem vulns + IaC/Dockerfile misconfig + secrets.
  # Complements gitleaks (secrets) and cargo-deny (Rust deps) with OS/IaC coverage.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, SHA-pinned (was @master — unpinned = non-repro/supply-chain risk)
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml # redactor-test fake tokens (parallels gitleaks allowlist)
          exit-code: "1" # fail the job on CRITICAL/HIGH findings

  # Validate compose file syntax without pulling models / starting the stack.
  # Catches docker-compose.yml drift (e.g. service name changes that break Makefile COMPOSE fallback).
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate docker-compose config
        run: docker compose config >/dev/null || docker-compose config >/dev/null

  # Ensure the Rust engine image still builds from a clean checkout.
  # Catches Dockerfile / Cargo drift that guard.sh (stack-free) cannot detect.
  docker-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: build drudge image
        run: make build

  # Behavioral RAG gate — recall@k regression on the golden set (data/eval/golden.json).
  # Embeddings are replayed OFFLINE from recorded real bge-m3 vectors (data/eval/stub_embedder.py),
  # so no GPU/model pull is needed and CI recall == real recall. The stack runs in vector mode via
  # docker compose; the stub serves on the runner host, reached from the container at
  # host.docker.internal (the engine's configured base_url). This is the eval-gate.sh path that was
  # previously manual-only (`make eval`).
  eval-gate:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.eval != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # before the DB gate suites: search/test_pg.py imports psycopg
      - name: install python deps (door + search/pg.py)
        run: |
          uv sync --locked
          uv pip install --quiet -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: drudge
          shared-key: drudge # same key across every job that builds drudge, so the cache isn't split per job name
      - name: start postgres (for the DB gate suites, ahead of the drudge container)
        run: |
          export BORING_UID="$(id -u)" BORING_GID="$(id -g)"
          docker compose --profile vector up -d --wait boring-postgres
      # These 6 suites need a live Postgres (BORING_TEST_DATABASE_URL) and, until now, ran nowhere —
      # not in CI, not in pre-commit, not in the Makefile. That left the pool-vs-single-Client
      # regression (2026-07-25 outage) with no safety net. Reuses the eval-gate postgres — no new
      # service container. Each suite is invoked separately and failures are accumulated (not
      # short-circuited) because `cargo test` refuses to start a later test binary once an earlier
      # one has failed — running them as one invocation would silently hide every suite after the
      # first failure.
      - name: DB gate suites (every drudge/tests/*.rs + search/pg.py integration)
        env:
          BORING_TEST_DATABASE_URL: postgresql://boring:boring@127.0.0.1:5432/boring
          BORING_EVENT_ISOLATED_LOG: /tmp/boring-ci-events.ndjson
        run: |
          cd drudge
          fail=0
          for suite in $(ls tests/*.rs | xargs -n1 basename | sed 's/\.rs$//'); do
            echo "::group::cargo test --test $suite"
            if ! cargo test -p drudge --test "$suite" -- --test-threads=1; then
              echo "FAILED: $suite"
              fail=1
            fi
            echo "::endgroup::"
          done
          cd "$GITHUB_WORKSPACE"
          # The door's python /search store queries (search/pg.py) — same disposable-DB
          # convention: a separate schema, dropped afterwards. Skips without the URL.
          echo "::group::python search/pg.py integration"
          if ! uv run --locked python src/ohmyboring/search/test_pg.py; then
            echo "FAILED: search/test_pg.py"
            fail=1
          fi
          echo "::endgroup::"
          echo "::group::python remember/writer.py integration"
          if ! uv run --locked python src/ohmyboring/remember/test_writer.py; then
            echo "FAILED: remember/test_writer.py"
            fail=1
          fi
          echo "::endgroup::"
          echo "::group::python registers read-path integration"
          if ! uv run --locked python src/ohmyboring/registers/test_pg.py; then
            echo "FAILED: registers/test_pg.py"
            fail=1
          fi
          echo "::endgroup::"
          exit "$fail"
      - name: reset DB (DB gate suites leave rows behind; drudge/eval-gate need a clean corpus)
        run: |
          docker compose --profile vector exec -T boring-postgres \
            psql -v ON_ERROR_STOP=1 -U boring -d postgres \
            -c "DROP DATABASE IF EXISTS boring;" \
            -c "CREATE DATABASE boring OWNER boring;"
      - name: start offline stub embedder (recorded bge-m3 replay)
        run: |
          uv run --locked python data/eval/stub_embedder.py &
          for _ in $(seq 1 20); do curl -sf http://localhost:11434/v1/models >/dev/null && break; sleep 0.5; done
          curl -sf http://localhost:11434/v1/models
      - name: prepare config + mounts
        run: |
          # boring.example.json already points llm.base_url at host.docker.internal:11434/v1 (the stub),
          # embed_dim=1024 matches the recording. provider/bootstrap are host-side only (unused here).
          cp boring.example.json boring.json
          mkdir -p vault/raw vault/wiki "$HOME/.claude/projects"
      - name: start stack (vector mode)
        env:
          BORING_VECTOR: "on"
        run: |
          # Run the container as the runner user so it can write the bind-mounted vault (Linux EACCES guard).
          export BORING_UID="$(id -u)" BORING_GID="$(id -g)"
          docker compose --profile vector up -d --build boring-drudge boring-postgres
          for _ in $(seq 1 60); do curl -sf -m3 http://127.0.0.1:7700/health >/dev/null 2>&1 && break; sleep 3; done
          curl -sf -m3 http://127.0.0.1:7700/health
      # The door's own POST /search (python engine E2a) answers from the same DB the engine
      # synced — started here so eval-gate.sh can run the golden set through it afterwards.
      - name: start door (python /search path)
        run: |
          DOOR_PG_DSN=postgresql://boring:boring@127.0.0.1:5432/boring \
          DOOR_UPSTREAM=http://127.0.0.1:7700 \
          BORING_LLM_BASE_URL=http://127.0.0.1:11434/v1 \
          uv run --locked python -m uvicorn agents.door.door:app --host 127.0.0.1 --port 7710 &
          for _ in $(seq 1 60); do curl -sf -m3 http://127.0.0.1:7710/health >/dev/null 2>&1 && break; sleep 1; done
          curl -sf -m3 http://127.0.0.1:7710/health
      # A DB upgraded from the shipped schema must equal one built fresh. Every other DB suite
      # starts from an empty container, so "the migration was never written" is invisible to
      # them — and it already shipped once.
      - name: schema parity (upgraded DB == fresh DB)
        run: ./scripts/test_schema_parity.sh

      - name: behavioral gate (eval-gate.sh — drudge + door python /search)
        env:
          BORING_URL: http://127.0.0.1:7700
          # The same golden run through the door's python /search (E2a); both must be 22/22.
          BORING_EVAL_EXTRA_URL: http://127.0.0.1:7710
        run: ./scripts/eval-gate.sh
      - name: engine contract parity (MCP tools · HTTP routes · GET shapes == data/contract snapshot)
        env:
          DRUDGE_URL: http://127.0.0.1:7700
        run: uv run --locked python scripts/contract-parity.py --check
      - name: engine logs on failure
        if: failure()
        run: docker compose --profile vector logs boring-drudge boring-postgres
