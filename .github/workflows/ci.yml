name: ci

# 클라우드는 로컬이 못 하는 것만 돈다 (오너 10-06 wiki-3334, 10-19 「CI에서도 전체 돌리지 말라구요」).
# 시험·린트는 로컬 pre-commit 이 바뀐 파일만 돌린다. 이미지 빌드·취약점 검사는 image.yml (main push·태그).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리 스캔(과거 커밋 누수도 잡음)
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
